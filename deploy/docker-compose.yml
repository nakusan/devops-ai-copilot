# DevOps AI Copilot — 本地一键编排（Phase 6 / W12）
#
# 用法：
#   仅中间件（本机跑应用）：  docker compose up -d
#   全栈（含双栈应用）：      docker compose --profile apps up -d --build
#   或：make infra-up / make stack-up
#
# Kafka 双监听（W12 补全 Phase 4 延后项）：
#   - PLAINTEXT://localhost:9092     → 宿主机进程（mvn / uv）
#   - PLAINTEXT_INTERNAL://kafka:29092 → Compose 内应用容器
# 否则容器内客户端连 localhost:9092 会打到自己，导致生产/消费失败。

name: devops-ai-copilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dac-postgres
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dac-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka KRaft 单节点（无需 ZooKeeper）
  kafka:
    image: apache/kafka:3.8.0
    container_name: dac-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 三监听：对外 / 容器互联 / 控制器
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # broker 间通信走内部监听，避免 advertised localhost 在容器网络失效
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: dac-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 可选：首次启动时尽力创建默认 bucket
  minio-init:
    image: minio/mc:latest
    container_name: dac-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/devops-copilot || true;
      exit 0;
      "
    restart: "no"

  # ---------- 应用（profile=apps；make stack-up）----------
  # MCP Mock：进程内 stdio spawn（设计 6.6 方式 A），无需独立容器

  control-plane:
    profiles: ["apps"]
    build:
      context: ../control-plane
      dockerfile: Dockerfile
    image: dac-control-plane:local
    container_name: dac-control-plane
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: copilot
      DB_USER: copilot
      DB_PASSWORD: copilot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: devops-copilot
      AI_PLANE_BASE_URL: http://ai-plane:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-secret-key}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:-dev-only-service-token-secret-change-me}
      # 容器日志走 JSON，便于集中采集（本机开发可不设）
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
      # 不硬等 ai-plane：WebClient 懒连接；避免与「Python 回调 Java」形成编排死锁感
    restart: unless-stopped

  ai-plane:
    profiles: ["apps"]
    build:
      context: ../ai-plane
      dockerfile: Dockerfile
    image: dac-ai-plane:local
    container_name: dac-ai-plane
    ports:
      - "8000:8000"
    environment:
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:-dev-only-service-token-secret-change-me}
      JAVA_INTERNAL_BASE_URL: http://control-plane:8080
      # 最小权限：只读角色（13_readonly_role.sql）；禁止 RAG 路径写库
      DATABASE_READONLY_URL: postgresql://copilot_ro:copilot_ro@postgres:5432/copilot
      KAFKA_BOOTSTRAP: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: devops-copilot
      MINIO_SECURE: "false"
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      CHAT_BACKEND: orchestrator
      MCP_ENABLED: "true"
      OTEL_SERVICE_NAME: ai-plane
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    # ai-plane HTTP 不强制等 control-plane：避免循环依赖（Java 依赖 Python health）
    # Worker / 回调路径在 control-plane 起来后自然可用
    restart: unless-stopped

  # 独立 Kafka Worker（与 HTTP 分进程，对齐 Phase 4 决策）
  ai-plane-worker:
    profiles: ["apps"]
    image: dac-ai-plane:local
    container_name: dac-ai-plane-worker
    build:
      context: ../ai-plane
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:-dev-only-service-token-secret-change-me}
      JAVA_INTERNAL_BASE_URL: http://control-plane:8080
      DATABASE_READONLY_URL: postgresql://copilot_ro:copilot_ro@postgres:5432/copilot
      KAFKA_BOOTSTRAP: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: devops-copilot
      MINIO_SECURE: "false"
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      WORKER_ROLES: knowledge,analysis
      OTEL_SERVICE_NAME: ai-plane
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
      control-plane:
        condition: service_healthy
    # Worker 无 HTTP，关闭镜像默认 healthcheck
    healthcheck:
      disable: true
    restart: unless-stopped

  # Phase 5 / W10：可观测栈（发布态：同网络服务名抓取，见 prometheus/prometheus.yml）
  # 应用未启动时 target 会 DOWN，属预期；全栈 stack-up 后应 UP。
  # 宿主机跑应用时叠用：-f deploy/docker-compose.hybrid-metrics.yml
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dac-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: dac-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboard-json:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
