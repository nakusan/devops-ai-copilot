server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # 本地开发：尽快落盘，便于刚发的请求马上能搜到
  max_block_duration: 5m

compactor:
  compaction:
    # 本地磁盘保留 48h，够做排障演练，避免无限增长
    block_retention: 48h

# P4：service graph / span metrics → Prometheus（设计 6.10 §8.1）
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
