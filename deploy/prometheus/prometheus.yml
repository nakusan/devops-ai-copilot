# Prometheus 抓取配置（全栈 / 发布态 — 业界常见写法）
#
# 目标：与被监控服务同一 Docker 网络，用**服务名**发现，而不是绕宿主机。
# 对应 make stack-up（control-plane / ai-plane 在 Compose 内）。
#
# 若只用 make infra-up、应用在宿主机跑：改挂 prometheus.hybrid.yml（见该文件注释）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:8080"]
        labels:
          application: control-plane

  - job_name: ai-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-plane:8000"]
        labels:
          application: ai-plane
