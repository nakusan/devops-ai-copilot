# 可选：中间件在 Docker、应用在宿主机时的抓取配置（本地开发变体）
#
# 用法示例：
#   docker compose -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.hybrid-metrics.yml up -d
#
# 或临时改挂载（不推荐长期）：把 prometheus 的 volume 指到本文件。
# 正式演示 / 学习「发布态」请用默认 prometheus.yml（容器服务发现）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: control-plane

  - job_name: ai-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          application: ai-plane
