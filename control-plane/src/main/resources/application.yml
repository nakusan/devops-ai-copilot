server:
  port: 8080

spring:
  application:
    name: control-plane
  servlet:
    multipart:
      # 分析文件上限 100MB；知识库 20MB 由业务层再校验
      max-file-size: 100MB
      max-request-size: 105MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        # 跨语言消费：不写 Java 类型头，Python 只解析 JSON body
        spring.json.add.type.headers: false
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:copilot}
    username: ${DB_USER:copilot}
    password: ${DB_PASSWORD:copilot}
    hikari:
      # 连接池参数：本地开发用较小值；生产再按 QPS 调优
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期可打开；生产建议关闭或改 slf4j
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# 业务自定义配置（与设计书 security.* / copilot.* 对齐）
copilot:
  jwt:
    # 生产必须用环境变量注入足够长的随机密钥（HS256 建议 >= 32 字节）
    secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret-key}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  service-token:
    secret: ${SERVICE_TOKEN_SECRET:dev-only-service-token-secret-change-me}
    ttl: 5m
    # 出站：Java → Python
    audience: ai-plane
    # 入站：Python → Java（与出站 aud 分离，防止 Token 跨向复用）
    inbound-audience: control-plane
    issuer: control-plane
  rate-limit:
    user-per-minute: 60
    ip-per-minute: 120
  quota:
    # Redis key: quota:team:{teamId}:daily_tokens，TTL 对齐「自然日」简化为 24h
    redis-key-ttl: 24h
  ai-plane:
    base-url: ${AI_PLANE_BASE_URL:http://localhost:8000}
    # 流式读超时：Mock 很快；接真 LLM 后可调到 60~120s
    read-timeout: 120s
    connect-timeout: 5s
  chat:
    # SSE 整段超时；连接期间不因 JWT 15min 过期而中断（设计 3.6.6）
    sse-timeout: 5m
    default-history-limit: 20
    # 预检配额时对 user 文本的粗估：chars/4
    estimate-chars-per-token: 4
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:devops-copilot}
  kafka:
    topics:
      knowledge-ingest: knowledge.ingest.v1
      analysis-ingest: analysis.ingest.v1
      knowledge-dlq: knowledge.ingest.dlq.v1
      analysis-dlq: analysis.ingest.dlq.v1
  file:
    knowledge:
      max-bytes: 20971520
      allowed-extensions:
        - pdf
        - md
        - txt
    analysis:
      max-bytes: 104857600
      allowed-extensions:
        - log
        - txt
        - hprof
    upload-rate-limit-per-hour: 10

logging:
  level:
    root: INFO
    com.devops.copilot: INFO
  pattern:
    # 结构化排障：每条日志带 traceId（由 TraceIdFilter 写入 MDC）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n"
