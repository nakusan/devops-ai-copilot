name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: control-plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # 静态检查基线：编译 + 单元测试（设计 Week 12「静态代码审查」）
      - name: Test
        run: mvn -B test
      - name: Package
        run: mvn -B -DskipTests package

  ai-plane:
    name: ai-plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-plane
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      # Ruff：风格 + 明显缺陷（E/F/I/UP/B/SIM）
      - name: Ruff
        run: uv run ruff check .
      # 静态类型门禁：与 Ruff/Pytest 并列，贴近业界 Python 工程化基线
      - name: Pyright
        run: uv run pyright app
      - name: Pytest
        run: uv run pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # 验证多阶段 Dockerfile 可构建（不推送）
      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: ./control-plane
          file: ./control-plane/Dockerfile
          push: false
          tags: dac-control-plane:ci
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane
      - name: Build ai-plane image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-plane
          file: ./ai-plane/Dockerfile
          push: false
          tags: dac-ai-plane:ci
          cache-from: type=gha,scope=ai-plane
          cache-to: type=gha,mode=max,scope=ai-plane
      # Compose 文件语法校验（不真正拉起中间件，避免 CI 过重）
      - name: Compose config
        run: docker compose -f deploy/docker-compose.yml --profile apps config --quiet
