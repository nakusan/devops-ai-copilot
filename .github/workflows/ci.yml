name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  control-plane:
    name: control-plane compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests compile

  ai-plane:
    name: ai-plane lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-plane
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q
